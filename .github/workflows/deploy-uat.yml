name: Deploy UAT Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uat-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install & build (UAT API)
        env:
          VITE_API_BASE_URL: https://uat-api.kincore.com/api
          # Anon key is publishable (same as local UAT build)
          VITE_SUPABASE_URL: https://fpzuqnpoksaeacedirns.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kPpwNv366jML2cE1HNtMaA_3ia5XAmF
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/uat_key
          chmod 600 ~/.ssh/uat_key
          ssh-keyscan -p "${{ secrets.UAT_SSH_PORT || 22 }}" -H "${{ secrets.UAT_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to uat-admin (nginx proxies to Coolify :8114)
        env:
          HOST: ${{ secrets.UAT_HOST }}
          USER: ${{ secrets.UAT_USER }}
          PORT: ${{ secrets.UAT_SSH_PORT || 22 }}
        run: |
          RSYNC="rsync -avz --delete -e \"ssh -i ~/.ssh/uat_key -p ${PORT} -o IdentitiesOnly=yes\""
          eval $RSYNC ./dist/ "${USER}@${HOST}:/tmp/kincore-uat-admin-dist/"
          ssh -i ~/.ssh/uat_key -p "${PORT}" -o IdentitiesOnly=yes "${USER}@${HOST}" '
            set -e
            CONTAINER=$(docker ps --filter publish=8114 --format "{{.Names}}" | head -1)
            if [ -z "$CONTAINER" ]; then
              echo "No container publishing host port 8114 (uat-admin proxy target)" >&2
              exit 1
            fi
            docker cp /tmp/kincore-uat-admin-dist/. "${CONTAINER}:/usr/share/nginx/html/"
            rsync -a --delete /tmp/kincore-uat-admin-dist/ /var/www/uat-admin.kincore.com/ 2>/dev/null || true
          '
